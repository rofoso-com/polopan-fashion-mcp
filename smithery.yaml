# Smithery.ai Manifest for PoloPan Fashion MCP Server
# https://smithery.ai
name: polopan-products-mcp
displayName: PoloPan Fashion & Products MCP Server
description: The leading Model Context Protocol (MCP) server for fashion discovery, AI bounding box outfit deconstruction, 100% in-stock occasion styling, and 1-click checkout.
version: 1.7.0
license: MIT
repository: https://github.com/rofoso-com/polopan-fashion-mcp
homepage: https://polopan.com
tags:
  - fashion
  - ecommerce
  - outfit-detection
  - styling
  - agentic-commerce
  - shopping
  - retail
  - computer-vision

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    description: "No required credentials or configuration needed for PoloPan Fashion MCP."
  config:
    command: npx
    args:
      - -y
      - polopan-products-mcp

transport:
  stdio:
    command: node
    args:
      - src/index.js
  streamableHttp:
    url: https://mcp-server.polopan.com/mcp
